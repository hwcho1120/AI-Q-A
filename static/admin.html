<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>답변 검토 관리</title>
<style>
:root{
  --bg:#f5f7fa; --card:#fff; --ink:#1b2430; --sub:#5b6675; --line:#e2e7ee;
  --brand:#1f4e9a; --brand-soft:#e8effa; --ok:#11845b; --ok-soft:#e3f5ec;
  --bad:#c2410c; --bad-soft:#fdeee5; --warn:#8a6d00; --warn-soft:#fdf6dc; --hl:#fff3b0;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1419; --card:#171e26; --ink:#e6ebf1; --sub:#9aa6b4; --line:#2a3440;
  --brand:#7aa7ff; --brand-soft:#1b2a44; --ok:#4ade80; --ok-soft:#123222;
  --bad:#fb923c; --bad-soft:#3a2114; --warn:#facc15; --warn-soft:#332b0c; --hl:#5a4b10;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;line-height:1.55}
header{background:var(--brand);color:#fff;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
header h1{margin:0;font-size:19px} header p{margin:2px 0 0;font-size:13px;opacity:.85}
header a{color:#fff;font-size:13px}
.wrap{max-width:1320px;margin:0 auto;padding:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.stat b{display:block;font-size:24px} .stat span{font-size:12.5px;color:var(--sub)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 12px}
.tab.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:14px}
@media (max-width:900px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.list{max-height:calc(100vh - 260px);overflow:auto;padding:6px}
@media (max-width:900px){.list{max-height:none}}
.item{padding:10px;border-radius:8px;cursor:pointer;border:1px solid transparent}
.item:hover{background:var(--bg)} .item.on{border-color:var(--brand);background:var(--brand-soft)}
.item .q{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .m{font-size:12px;color:var(--sub);margin-top:2px}
.pill{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:999px;margin-right:4px;font-weight:600}
.p-pending{background:var(--warn-soft);color:var(--warn)} .p-auto{background:var(--bg);color:var(--sub)}
.p-approved{background:var(--ok-soft);color:var(--ok)} .p-rejected{background:var(--bad-soft);color:var(--bad)}
.p-corrected{background:var(--brand-soft);color:var(--brand)}
.label{font-size:12px;color:var(--sub);font-weight:600;margin:12px 0 4px}
.flag{display:block;font-size:13px;color:var(--warn);background:var(--warn-soft);padding:4px 8px;border-radius:6px;margin:3px 0}
.ans{white-space:pre-wrap;font-size:15px}
.cite{display:block;width:100%;text-align:left;margin:4px 0;border:none;border-left:4px solid var(--brand);background:var(--brand-soft)}
.para{padding:6px 8px;border-radius:6px;margin:3px 0;white-space:pre-wrap;font-size:13.5px}
.para.hl{background:var(--hl);border-left:4px solid var(--warn)}
.src{border-top:1px dashed var(--line);margin-top:10px;padding-top:6px;max-height:280px;overflow:auto}
textarea,input{width:100%;font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.b-ok{background:var(--ok);color:#fff;border-color:var(--ok)} .b-bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.b-fix{background:var(--brand);color:#fff;border-color:var(--brand)}
.muted{color:var(--sub);font-size:14px}
table{border-collapse:collapse;width:100%;font-size:12px} td,th{border:1px solid var(--line);padding:3px 5px;text-align:center}
</style>
</head>
<body>
<header>
  <div><h1>답변 검토 관리</h1><p>AI 답변 중 사람이 확인해야 할 건을 자동으로 모읍니다. 담당자가 원문과 대조해 승인·반려·수정합니다.</p></div>
  <a href="/">← 질문 화면</a>
</header>
<div class="wrap">
  <div class="stats" id="stats"></div>
  <div class="tabs" id="tabs">
    <button class="tab on" data-s="pending">승인 대기</button>
    <button class="tab" data-s="unknown">확인 불가 점검</button>
    <button class="tab" data-s="auto">자동 공개</button>
    <button class="tab" data-s="approved">승인</button>
    <button class="tab" data-s="corrected">수정</button>
    <button class="tab" data-s="rejected">반려</button>
    <button class="tab" data-s="all">전체</button>
    <span style="flex:1"></span>
    <button id="export">검토 결과 내보내기 (평가 문항)</button>
  </div>
  <div class="grid">
    <div class="card list" id="list"></div>
    <div class="card" id="detail"><p class="muted">왼쪽에서 항목을 고르세요.</p></div>
  </div>
</div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LABEL = {pending:"승인 대기", auto:"자동 공개", unknown:"확인 불가", approved:"승인", rejected:"반려", corrected:"수정"};
const delivery = x => x.source === "api" ? "API 응답 완료 · 사후 검토"
  : (x.held ? (x.status === "pending" ? "시민 화면 비공개 · 승인 대기 중" : x.status === "rejected" ? "비공개 처리됨" : "승인 후 시민에게 공개됨") : "시민에게 즉시 공개됨");
let token = new URLSearchParams(location.search).get("token") || "";
try { token = token || sessionStorage.getItem("adminToken") || ""; } catch (e) {}
let status = "pending", items = [], cur = null;

async function api(path, opt = {}) {
  const r = await fetch(path, {...opt, headers: {"Content-Type": "application/json", "X-Admin-Token": token, ...(opt.headers || {})}});
  if (r.status === 401) {
    token = prompt("관리자 토큰을 입력하세요") || "";
    try { sessionStorage.setItem("adminToken", token); } catch (e) {}
    return api(path, opt);
  }
  return r.json();
}

async function loadStats() {
  const s = await api("/api/admin/stats"), c = s.counts || {};
  const done = (c.approved || 0) + (c.corrected || 0) + (c.rejected || 0);
  $("#stats").innerHTML = [
    ["전체 질의", s.total], ["승인 대기", c.pending || 0], ["시민 화면 공개 보류", s.held],
    ["자동 공개율 (답변 기준)", s.auto_rate == null ? "-" : Math.round(s.auto_rate * 100) + "%"],
    ["확인 불가 점검", c.unknown || 0], ["검토 완료", done], ["평균 응답", s.avg_elapsed + "초"],
  ].map(([k, v]) => `<div class="stat"><b>${esc(v)}</b><span>${k}</span></div>`).join("");
}

async function loadList() {
  items = await api("/api/admin/items?status=" + status);
  $("#list").innerHTML = items.length ? items.map(x => `
    <div class="item ${cur && cur.id === x.id ? "on" : ""}" data-id="${x.id}">
      <div class="q">${esc(x.question)}</div>
      <div class="m"><span class="pill p-${x.status}">${LABEL[x.status]}</span>
        #${x.id} · ${new Date(x.ts * 1000).toLocaleString("ko-KR")} · ${delivery(x)} · ${x.elapsed ? x.elapsed.toFixed(1) + "초" : ""}
        ${(x.flags || []).length ? " · ⚠ " + esc(x.flags[0]) : ""}</div>
    </div>`).join("") : `<p class="muted">해당하는 항목이 없습니다.</p>`;
  $("#list").onclick = e => { const it = e.target.closest(".item"); if (it) show(+it.dataset.id); };
}

function show(id) {
  cur = items.find(x => x.id === id);
  document.querySelectorAll(".item").forEach(el => el.classList.toggle("on", +el.dataset.id === id));
  const r = cur.result || {}, fix = cur.corrected || {};
  $("#detail").innerHTML = `
    <div><span class="pill p-${cur.status}">${LABEL[cur.status]}</span> <span class="muted">#${cur.id} · ${delivery(cur)}</span></div>
    <div class="label">질문</div><div style="font-weight:600">${esc(cur.question)}</div>
    ${(cur.flags || []).length ? `<div class="label">검토가 필요한 이유</div>${cur.flags.map(f => `<span class="flag">⚠ ${esc(f)}</span>`).join("")}` : ""}
    <div class="label">AI 답변</div><div class="ans">${esc(r.answer)}</div>
    <div class="label">인용 조항 (누르면 원문 대조)</div>
    ${(r.citation || []).length ? r.citation.map(c => `<button class="cite" data-l="${esc(c)}">📎 ${esc(c)}</button>`).join("") : `<p class="muted">인용 없음</p>`}
    ${r.effective_date ? `<div class="muted" style="margin-top:6px">시행일 ${esc(r.effective_date)} · <a href="${esc(r.source_url)}" target="_blank" rel="noopener">법제처 원문 ↗</a></div>` : ""}
    <div class="src" id="srcbox" hidden></div>
    ${(cur.top_hits || []).length ? `<details style="margin-top:8px;font-size:13px;color:var(--sub)"><summary>검색된 후보 조문</summary><ul>${cur.top_hits.map(h => `<li><a href="#" class="hit" data-l="${esc(h)}">${esc(h)}</a></li>`).join("")}</ul></details>` : ""}
    <div class="label">검토 의견</div>
    <input id="note" value="${esc(cur.reviewer_note || "")}" placeholder="예) 제7조 제3항도 함께 인용해야 함">
    <details id="fixbox" ${cur.status === "corrected" ? "open" : ""} style="margin-top:8px"><summary style="cursor:pointer">답변 수정하기</summary>
      <div class="label">수정 답변</div><textarea id="fa" rows="4">${esc(fix.answer ?? r.answer ?? "")}</textarea>
      <div class="label">수정 인용 (한 줄에 하나)</div><textarea id="fc" rows="3">${esc((fix.citation ?? r.citation ?? []).join("\n"))}</textarea>
    </details>
    <div class="actions">
      ${cur.status === "unknown" || cur.stage === "error" || !(r.citation || []).length
        ? `<button class="b-ok" data-a="approved">확인 불가가 맞음</button>
           <button class="b-fix" data-a="corrected">근거 있음 — 답변 작성해 저장</button>`
        : `<button class="b-ok" data-a="approved">승인${cur.held ? " 후 공개" : ""}</button>
           <button class="b-fix" data-a="corrected">수정${cur.held ? " 후 공개" : " 저장"}</button>
           <button class="b-bad" data-a="rejected">반려${cur.held ? " (비공개)" : ""}</button>`}
      ${["approved", "corrected", "rejected"].includes(cur.status) ? `<button data-a="${(r.citation || []).length ? "pending" : "unknown"}">결정 취소</button>` : ""}
    </div>`;
  $("#detail").querySelectorAll(".cite,.hit").forEach(b => b.onclick = e => { e.preventDefault(); source(b.dataset.l); });
  $("#detail").querySelectorAll(".actions button").forEach(b => b.onclick = () => decide(b.dataset.a));
}

async function source(label) {
  const box = $("#srcbox"); box.hidden = false; box.innerHTML = "불러오는 중…";
  const s = await fetch("/api/source?label=" + encodeURIComponent(label)).then(r => r.json());
  if (!s.found) { box.innerHTML = `<p class="muted">원문을 찾지 못했습니다: ${esc(label)}</p>`; return; }
  let body = "";
  if (s.kind === "article") body = s.paragraphs.map(p => `<div class="para ${!s.highlight || p.no === s.highlight ? "hl" : ""}">${esc(p.text)}</div>`).join("");
  else if (s.kind === "annex") body = s.markdown.split("\n").filter(l => l.trim()).map(l => l.trim().startsWith("|")
      ? (/^\|\s*-{3}/.test(l.trim()) ? "" : "<table><tr>" + l.trim().replace(/^\||\|$/g, "").split("|").map(c => `<td>${esc(c.trim())}</td>`).join("") + "</tr></table>")
      : `<div style="font-size:13px">${esc(l.replace(/^[-#\s]+/, ""))}</div>`).join("");
  else body = `<pre style="white-space:pre-wrap;font-size:12px">${esc(s.text)}</pre>`;
  box.innerHTML = `<div style="font-weight:600;font-size:14px">${esc(label)}${s.title ? ` (${esc(s.title)})` : ""}</div>${body}`;
}

async function decide(a) {
  const body = {status: a, note: $("#note").value};
  if (a === "corrected") {
    body.answer = $("#fa").value;
    body.citation = $("#fc").value.split("\n").map(x => x.trim()).filter(Boolean);
  }
  if (a === "rejected" && !body.note.trim() && !confirm("반려 사유 없이 반려할까요?")) return;
  await api("/api/admin/items/" + cur.id, {method: "POST", body: JSON.stringify(body)});
  await loadStats(); await loadList();
  const next = items.find(x => x.id !== cur.id);
  if (next) show(next.id); else $("#detail").innerHTML = `<p class="muted">처리했습니다.</p>`;
}

$("#tabs").onclick = e => {
  const b = e.target.closest(".tab"); if (!b) return;
  document.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x === b));
  status = b.dataset.s; cur = null; $("#detail").innerHTML = `<p class="muted">왼쪽에서 항목을 고르세요.</p>`; loadList();
};
$("#export").onclick = async () => {
  const d = await api("/api/admin/export");
  const blob = new Blob([JSON.stringify(d, null, 1)], {type: "application/json"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "review_export.json"; a.click();
};
loadStats(); loadList();
</script>
</body>
</html>
