<!doctype html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#17171c">
<script>try{document.documentElement.setAttribute("data-theme",localStorage.getItem("fl-theme")==="light"?"light":"dark");}catch(e){document.documentElement.setAttribute("data-theme","dark");}</script>
<title>Fact Law - 답변 검토 관리</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* factlaw.html과 같은 색·글꼴 (보라 계열). 다크가 기본, 우측 상단 버튼으로 라이트 전환 — 설정은 factlaw와 공유(fl-theme) */
:root{
  --bg:#f2f4f6; --card:#fff; --ink:#191f28; --ink-2:#4e5968; --sub:#8b95a1; --line:#e5e8eb; --fill:#f2f4f6;
  --brand:#6a50e8; --brand-press:#5b45d6; --brand-soft:#efebff; --on-brand:#fff;
  --bad:#f04452; --bad-soft:#fdecee; --warn:#8a5a00; --warn-soft:#fff7e0; --hl:#efebff;
  --r-lg:20px; --r-md:14px;
}
:root[data-theme="dark"]{
  --bg:#17171c; --card:#202027; --ink:#f9fafb; --ink-2:#c3c8d0; --sub:#8b95a1; --line:#2e2e36; --fill:#2a2a32;
  --brand:#a594fa; --brand-press:#b8a9ff; --brand-soft:#2a2445; --on-brand:#17171c;
  --bad:#ff6b76; --bad-soft:#3a1d22; --warn:#f0c869; --warn-soft:#2d2916; --hl:#2a2445;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  font-size:15px;line-height:1.6;letter-spacing:-0.01em;word-break:keep-all;overflow-wrap:anywhere;-webkit-font-smoothing:antialiased}
a{color:var(--brand)}
.wrap{max-width:1320px;margin:0 auto;padding:0 20px 24px}
/* 상단 */
header{max-width:1320px;margin:0 auto;padding:0 20px;height:64px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{color:var(--ink);font-weight:800;font-size:20px;letter-spacing:-0.03em;text-decoration:none}
.brand em{font-style:normal;color:var(--brand)}
.chip{font-size:13px;font-weight:600;color:var(--brand);background:var(--brand-soft);padding:5px 11px;border-radius:999px;margin-left:10px;vertical-align:3px}
.tools{display:flex;align-items:center;gap:6px}
.back{font-size:14px;font-weight:600;color:var(--ink-2);text-decoration:none;padding:8px 12px;border-radius:999px}
.back:hover{background:var(--card);color:var(--ink)}
.theme{width:40px;height:40px;border-radius:50%;border:0;background:transparent;color:var(--ink-2);padding:0;display:grid;place-items:center}
.theme:hover{background:var(--card);color:var(--ink)}
.theme svg{width:21px;height:21px} .theme .i-sun{display:none}
:root[data-theme="dark"] .theme .i-sun{display:block} :root[data-theme="dark"] .theme .i-moon{display:none}
.intro{margin:8px 0 20px} .intro h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-0.035em}
.intro p{margin:6px 0 0;color:var(--ink-2);font-size:15px}
/* 통계 */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:18px}
.stat{background:var(--card);border-radius:var(--r-md);padding:14px 16px}
.stat b{display:block;font-size:24px;font-weight:800;letter-spacing:-0.02em} .stat span{font-size:13px;color:var(--sub)}
.stat.hot{background:var(--brand-soft)} .stat.hot b{color:var(--brand)}
/* 탭 = factlaw 주제 칩 모양 */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
button{font:inherit;letter-spacing:inherit;cursor:pointer;border:0;border-radius:999px;background:var(--card);color:var(--ink-2);font-weight:600;padding:9px 16px;transition:background .15s,color .15s}
button:hover{color:var(--ink)}
.tab.on{background:var(--brand-soft);color:var(--brand)}
#export{background:var(--brand);color:var(--on-brand)} #export:hover{background:var(--brand-press)}
:focus-visible{outline:3px solid color-mix(in srgb,var(--brand) 50%,transparent);outline-offset:2px}
/* 목록 · 상세 */
.grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:14px}
@media (max-width:900px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border-radius:var(--r-lg);padding:18px 20px}
.list{max-height:calc(100vh - 300px);overflow:auto;padding:8px}
@media (max-width:900px){.list{max-height:none}}
.item{padding:12px 14px;border-radius:var(--r-md);cursor:pointer;transition:background .15s}
.item + .item{margin-top:2px}
.item:hover{background:var(--fill)} .item.on{background:var(--brand-soft)}
.item .q{font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .m{font-size:12.5px;color:var(--sub);margin-top:3px}
.pill{display:inline-block;font-size:12px;padding:2px 9px;border-radius:999px;margin-right:4px;font-weight:700}
.p-pending{background:var(--warn-soft);color:var(--warn)} .p-auto,.p-unknown{background:var(--fill);color:var(--ink-2)}
.p-approved{background:var(--brand);color:var(--on-brand)} .p-rejected{background:var(--bad-soft);color:var(--bad)}
.p-corrected{background:var(--brand-soft);color:var(--brand)}
.label{font-size:13px;color:var(--sub);font-weight:600;margin:16px 0 6px}
.flag{display:block;font-size:14px;color:var(--warn);background:var(--warn-soft);padding:8px 12px;border-radius:12px;margin:4px 0}
.ans{white-space:pre-wrap;font-size:16px}
.cite{display:block;width:100%;text-align:left;margin:4px 0;border-radius:12px;background:var(--brand-soft);color:var(--brand);padding:10px 14px}
.para{padding:8px 12px;border-radius:10px;margin:4px 0;white-space:pre-wrap;font-size:14px;color:var(--ink-2)}
.para.hl{background:var(--hl);color:var(--ink);box-shadow:inset 3px 0 0 var(--brand)}
.src{border-top:1px solid var(--line);margin-top:12px;padding-top:10px;max-height:280px;overflow:auto}
textarea,input{width:100%;font:inherit;padding:10px 14px;border:0;border-radius:12px;background:var(--fill);color:var(--ink);outline:0}
textarea:focus,input:focus{box-shadow:0 0 0 2px var(--brand)}
textarea::placeholder,input::placeholder{color:var(--sub)}
summary{color:var(--ink-2);font-weight:600}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.b-ok{background:var(--brand);color:var(--on-brand)} .b-ok:hover{background:var(--brand-press);color:var(--on-brand)}
.b-fix{background:var(--brand-soft);color:var(--brand)} .b-fix:hover{color:var(--brand)}
.b-bad{background:var(--bad-soft);color:var(--bad)} .b-bad:hover{color:var(--bad)}
.actions button:not([class]){background:var(--fill)}
.muted{color:var(--sub);font-size:14px}
table{border-collapse:collapse;width:100%;font-size:12.5px} td,th{border:1px solid var(--line);padding:4px 6px;text-align:center}
</style>
</head>
<body>
<header>
  <div><a class="brand" href="/factlaw">Fact <em>Law</em></a><span class="chip">관리자</span></div>
  <div class="tools">
    <a class="back" href="/factlaw">← 질문 화면</a>
    <button class="theme" id="theme" type="button" aria-label="화면 모드 바꾸기" title="화면 모드 바꾸기">
      <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>
</header>
<div class="wrap">
  <div class="intro"><h1>답변 검토 관리</h1><p>AI 답변 중 사람이 확인해야 할 건을 자동으로 모아요. 담당자가 원문과 대조해 승인·반려·수정합니다.</p></div>
  <div class="stats" id="stats"></div>
  <div class="tabs" id="tabs">
    <button class="tab on" data-s="pending">승인 대기</button>
    <button class="tab" data-s="unknown">확인 불가 점검</button>
    <button class="tab" data-s="auto">자동 공개</button>
    <button class="tab" data-s="approved">승인</button>
    <button class="tab" data-s="corrected">수정</button>
    <button class="tab" data-s="rejected">반려</button>
    <button class="tab" data-s="all">전체</button>
    <span style="flex:1"></span>
    <button id="export">검토 결과 내보내기 (평가 문항)</button>
  </div>
  <div class="grid">
    <div class="card list" id="list"></div>
    <div class="card" id="detail"><p class="muted">왼쪽에서 항목을 고르세요.</p></div>
  </div>
</div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LABEL = {pending:"승인 대기", auto:"자동 공개", unknown:"확인 불가", approved:"승인", rejected:"반려", corrected:"수정"};
const delivery = x => x.source === "api" ? "API 응답 완료 · 사후 검토"
  : (x.held ? (x.status === "pending" ? "시민 화면 비공개 · 승인 대기 중" : x.status === "rejected" ? "비공개 처리됨" : "승인 후 시민에게 공개됨") : "시민에게 즉시 공개됨");
let token = new URLSearchParams(location.search).get("token") || "";
try { token = token || sessionStorage.getItem("adminToken") || ""; } catch (e) {}
let status = "pending", items = [], cur = null;

async function api(path, opt = {}) {
  const r = await fetch(path, {...opt, headers: {"Content-Type": "application/json", "X-Admin-Token": token, ...(opt.headers || {})}});
  if (r.status === 401) {
    token = prompt("관리자 토큰을 입력하세요") || "";
    try { sessionStorage.setItem("adminToken", token); } catch (e) {}
    return api(path, opt);
  }
  return r.json();
}

async function loadStats() {
  const s = await api("/api/admin/stats"), c = s.counts || {};
  const done = (c.approved || 0) + (c.corrected || 0) + (c.rejected || 0);
  $("#stats").innerHTML = [
    ["전체 질의", s.total], ["승인 대기", c.pending || 0], ["시민 화면 공개 보류", s.held],
    ["자동 공개율 (답변 기준)", s.auto_rate == null ? "-" : Math.round(s.auto_rate * 100) + "%"],
    ["확인 불가 점검", c.unknown || 0], ["검토 완료", done], ["평균 응답", s.avg_elapsed + "초"],
  ].map(([k, v]) => `<div class="stat${(k === "승인 대기" || k === "확인 불가 점검") && +v > 0 ? " hot" : ""}"><b>${esc(v)}</b><span>${k}</span></div>`).join("");
}

async function loadList() {
  items = await api("/api/admin/items?status=" + status);
  $("#list").innerHTML = items.length ? items.map(x => `
    <div class="item ${cur && cur.id === x.id ? "on" : ""}" data-id="${x.id}">
      <div class="q">${esc(x.question)}</div>
      <div class="m"><span class="pill p-${x.status}">${LABEL[x.status]}</span>
        #${x.id} · ${new Date(x.ts * 1000).toLocaleString("ko-KR")} · ${delivery(x)} · ${x.elapsed ? x.elapsed.toFixed(1) + "초" : ""}
        ${(x.flags || []).length ? " · ⚠ " + esc(x.flags[0]) : ""}</div>
    </div>`).join("") : `<p class="muted">해당하는 항목이 없습니다.</p>`;
  $("#list").onclick = e => { const it = e.target.closest(".item"); if (it) show(+it.dataset.id); };
}

function show(id) {
  cur = items.find(x => x.id === id);
  document.querySelectorAll(".item").forEach(el => el.classList.toggle("on", +el.dataset.id === id));
  const r = cur.result || {}, fix = cur.corrected || {};
  $("#detail").innerHTML = `
    <div><span class="pill p-${cur.status}">${LABEL[cur.status]}</span> <span class="muted">#${cur.id} · ${delivery(cur)}</span></div>
    <div class="label">질문</div><div style="font-weight:600">${esc(cur.question)}</div>
    ${(cur.flags || []).length ? `<div class="label">검토가 필요한 이유</div>${cur.flags.map(f => `<span class="flag">⚠ ${esc(f)}</span>`).join("")}` : ""}
    <div class="label">AI 답변</div><div class="ans">${esc(r.answer)}</div>
    <div class="label">인용 조항 (누르면 원문 대조)</div>
    ${(r.citation || []).length ? r.citation.map(c => `<button class="cite" data-l="${esc(c)}">📎 ${esc(c)}</button>`).join("") : `<p class="muted">인용 없음</p>`}
    ${r.effective_date ? `<div class="muted" style="margin-top:6px">시행일 ${esc(r.effective_date)} · <a href="${esc(r.source_url)}" target="_blank" rel="noopener">법제처 원문 ↗</a></div>` : ""}
    <div class="src" id="srcbox" hidden></div>
    ${(cur.top_hits || []).length ? `<details style="margin-top:8px;font-size:13px;color:var(--sub)"><summary>검색된 후보 조문</summary><ul>${cur.top_hits.map(h => `<li><a href="#" class="hit" data-l="${esc(h)}">${esc(h)}</a></li>`).join("")}</ul></details>` : ""}
    <div class="label">검토 의견</div>
    <input id="note" value="${esc(cur.reviewer_note || "")}" placeholder="예) 제7조 제3항도 함께 인용해야 함">
    <details id="fixbox" ${cur.status === "corrected" ? "open" : ""} style="margin-top:8px"><summary style="cursor:pointer">답변 수정하기</summary>
      <div class="label">수정 답변</div><textarea id="fa" rows="4">${esc(fix.answer ?? r.answer ?? "")}</textarea>
      <div class="label">수정 인용 (한 줄에 하나)</div><textarea id="fc" rows="3">${esc((fix.citation ?? r.citation ?? []).join("\n"))}</textarea>
    </details>
    <div class="actions">
      ${cur.status === "unknown" || cur.stage === "error" || !(r.citation || []).length
        ? `<button class="b-ok" data-a="approved">확인 불가가 맞음</button>
           <button class="b-fix" data-a="corrected">근거 있음 — 답변 작성해 저장</button>`
        : `<button class="b-ok" data-a="approved">승인${cur.held ? " 후 공개" : ""}</button>
           <button class="b-fix" data-a="corrected">수정${cur.held ? " 후 공개" : " 저장"}</button>
           <button class="b-bad" data-a="rejected">반려${cur.held ? " (비공개)" : ""}</button>`}
      ${["approved", "corrected", "rejected"].includes(cur.status) ? `<button data-a="${(r.citation || []).length ? "pending" : "unknown"}">결정 취소</button>` : ""}
    </div>`;
  $("#detail").querySelectorAll(".cite,.hit").forEach(b => b.onclick = e => { e.preventDefault(); source(b.dataset.l); });
  $("#detail").querySelectorAll(".actions button").forEach(b => b.onclick = () => decide(b.dataset.a));
}

async function source(label) {
  const box = $("#srcbox"); box.hidden = false; box.innerHTML = "불러오는 중…";
  const s = await fetch("/api/source?label=" + encodeURIComponent(label)).then(r => r.json());
  if (!s.found) { box.innerHTML = `<p class="muted">원문을 찾지 못했습니다: ${esc(label)}</p>`; return; }
  let body = "";
  if (s.kind === "article") body = s.paragraphs.map(p => `<div class="para ${!s.highlight || p.no === s.highlight ? "hl" : ""}">${esc(p.text)}</div>`).join("");
  else if (s.kind === "annex") body = s.markdown.split("\n").filter(l => l.trim()).map(l => l.trim().startsWith("|")
      ? (/^\|\s*-{3}/.test(l.trim()) ? "" : "<table><tr>" + l.trim().replace(/^\||\|$/g, "").split("|").map(c => `<td>${esc(c.trim())}</td>`).join("") + "</tr></table>")
      : `<div style="font-size:13px">${esc(l.replace(/^[-#\s]+/, ""))}</div>`).join("");
  else body = `<pre style="white-space:pre-wrap;font-size:12px">${esc(s.text)}</pre>`;
  box.innerHTML = `<div style="font-weight:600;font-size:14px">${esc(label)}${s.title ? ` (${esc(s.title)})` : ""}</div>${body}`;
}

async function decide(a) {
  const body = {status: a, note: $("#note").value};
  if (a === "corrected") {
    body.answer = $("#fa").value;
    body.citation = $("#fc").value.split("\n").map(x => x.trim()).filter(Boolean);
  }
  if (a === "rejected" && !body.note.trim() && !confirm("반려 사유 없이 반려할까요?")) return;
  await api("/api/admin/items/" + cur.id, {method: "POST", body: JSON.stringify(body)});
  await loadStats(); await loadList();
  const next = items.find(x => x.id !== cur.id);
  if (next) show(next.id); else $("#detail").innerHTML = `<p class="muted">처리했습니다.</p>`;
}

$("#tabs").onclick = e => {
  const b = e.target.closest(".tab"); if (!b) return;
  document.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x === b));
  status = b.dataset.s; cur = null; $("#detail").innerHTML = `<p class="muted">왼쪽에서 항목을 고르세요.</p>`; loadList();
};
$("#export").onclick = async () => {
  const d = await api("/api/admin/export");
  const blob = new Blob([JSON.stringify(d, null, 1)], {type: "application/json"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "review_export.json"; a.click();
};
$("#theme").onclick = () => {
  const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try { localStorage.setItem("fl-theme", next); } catch (e) { /* 저장 못 해도 이번 방문에는 적용됨 */ }
};
loadStats(); loadList();
</script>
</body>
</html>
